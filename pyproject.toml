[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "telegram-user-mcp"
version = "0.1.0"
description = "Local full-schema Telegram MTProto MCP server"
requires-python = ">=3.11"
dependencies = ["Telethon==1.45.0", "mcp>=1.20,<2"]
[project.scripts]
telegram-user-mcp = "telegram_mcp.server:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
